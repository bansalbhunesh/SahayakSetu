# Web service only. Secrets (sync: false) are set in the Render dashboard, not in git.
services:
  - type: web
    plan: free
    name: sahayaksetu-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CHAT_MODEL
        value: gemini-2.0-flash
      - key: FRONTEND_ORIGIN
        value: https://sahayak-setu.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://sahayak-setu.vercel.app
      - key: ALLOWED_ORIGIN_REGEX
        value: ^https://[a-z0-9-]+\.vercel\.app$
      - key: ENV
        value: production
      # Fail-closed on moderation classifier errors (see MODERATION_STRICT in config).
      - key: MODERATION_STRICT
        value: "true"
      - key: LLM_JSON_MODE
        value: "true"
      - key: HYBRID_RETRIEVAL
        value: "true"
      - key: HYBRID_KEYWORD_WEIGHT
        value: "0.3"
      - key: DEBUG_RETRIEVAL
        value: "false"
      - sync: false
        key: QDRANT_URL
      - sync: false
        key: QDRANT_API_KEY
      - sync: false
        key: GEMINI_API_KEY
      - sync: false
        key: GROQ_API_KEY
      - sync: false
        key: BACKEND_URL
      - sync: false
        key: REDIS_URL
      # Share Redis with SlowAPI so rate limits apply across instances (see RATE_LIMIT_USE_REDIS).
      - key: RATE_LIMIT_USE_REDIS
        value: "true"
      - sync: false
        key: SESSION_SECRET
      - sync: false
        key: VAPI_WEBHOOK_SECRET
